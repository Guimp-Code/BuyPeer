services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.buypeer.rule=Host(`buypeer.shop`)
      - traefik.http.routers.buypeer.entrypoints=websecure
      - traefik.http.routers.buypeer.tls.certresolver=letsencrypt
      - traefik.http.services.buypeer.loadbalancer.server.port=80
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "https://buypeer.shop"
      APP_KEY: "${APP_KEY:-base64:qaF9Z27M24O1jX/1RGsDlLjv6L9bZlDakc1UuG7o65Y=}"
      LOG_CHANNEL: stack
      LOG_LEVEL: error
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: buypeer
      DB_USERNAME: buypeer
      DB_PASSWORD: change_me
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      RUN_MIGRATIONS: "true"
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - traefik-proxy
      - internal
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: buypeer
      MYSQL_USER: buypeer
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: change_me_root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

volumes:
  app-storage:
  mysql-data:

networks:
  traefik-proxy:
    external: true
  internal:
    driver: bridge